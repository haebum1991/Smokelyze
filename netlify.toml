# ---- Security & Caching rules ----

# Apply Security Headers to ALL content
[[headers]]
  for = "/*"
  [headers.values]
  # Force HTTPS
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  # Prevent MIME-type sniffing
  X-Content-Type-Options = "nosniff"
  # Prevent Clickjacking
  X-Frame-Options = "SAMEORIGIN"
  # Basic XSS Protection (Browser Fallback)
  X-XSS-Protection = "1; mode=block"
  # Firebase Auth Popup Support
  Cross-Origin-Opener-Policy = "same-origin-allow-popups"
  # Content Security Policy
  Content-Security-Policy = """
    default-src 'self' https://*.firebaseapp.com https://apis.google.com https://www.gstatic.com https://*.googleapis.com https://tiles.openfreemap.org; 
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdn.plot.ly https://instant.page https://cdnjs.cloudflare.com https://*.googletagmanager.com https://*.google-analytics.com; 
    style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://fonts.googleapis.com; 
    img-src 'self' data: https: blob: https://storage.googleapis.com https://tiles.openfreemap.org https://*.googleusercontent.com https://*.google-analytics.com https://*.googletagmanager.com; 
    font-src 'self' data: https://fonts.gstatic.com https://unpkg.com https://cdnjs.cloudflare.com; 
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://tiles.openfreemap.org https://storage.googleapis.com https://unpkg.com https://www.gstatic.com https://cdn.plot.ly https://instant.page https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://apis.google.com https://*.googleusercontent.com https://ofmpub.epa.gov https://fetch-aichat-service-1068523865415.us-central1.run.app https://*.google-analytics.com https://*.googletagmanager.com; 
    worker-src 'self' blob:; 
    frame-src 'self' https://*.firebaseapp.com https://*.shinyapps.io https://apis.google.com;"""

[[headers]]
  for = "/sw.js"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Service-Worker-Allowed = "/"
  
[[headers]]
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/map_boundaries.geojson"
  [headers.values]
  Cache-Control = "public, max-age=31536000, must-revalidate"
  
[[headers]]
  for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, must-revalidate"
  
[[headers]]
  for = "/post/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, must-revalidate"

