
[build]
  command = "npm run build"
  publish = "public"

[context.production.environment]
  HUGO_VERSION = "0.143.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@google-cloud/storage"]

# for date .gzip data
[[redirects]]
  from = "/data_by_date/*"
  to   = "/.netlify/functions/gcs-proxy/data_by_date/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/data_by_aqs/*"
  to   = "/.netlify/functions/gcs-proxy/data_by_aqs/:splat"
  status = 200
  force  = true

[[redirects]]
