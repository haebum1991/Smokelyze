<script>document.body.classList.add("page-about");</script>

<h1 style="text-align: center;">
    Contact Us
</h1>

<div class="card-about reveal-on-scroll">
    <p style="text-align: center; margin-bottom: 2rem;">
        Have any questions or feedback? <br>
        Fill out the form below and we will get back to you as soon as possible.
    </p>

    <!-- 
      Netlify Forms:
      Adding data-netlify="true" tells Netlify to automatically process this form.
      You can configure email notifications for new submissions in your Netlify Dashboard.
    -->
    
    <form name="contact" method="POST" data-netlify="true"
        style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">

        <!-- This hidden field is for Netlify's bot protection (optional but recommended) -->
        <input type="hidden" name="form-name" value="contact" />

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="name" style="color: var(--card-shadow); font-weight: bold;">Name</label>
            <input type="text" id="name" name="name" required placeholder="Your Name"
                style="padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--card-shadow); background: var(--bg-card, #fff); color: var(--text-strong); font-size: 1.6rem; outline: none;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="email" style="color: var(--card-shadow); font-weight: bold;">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="your.email@example.com"
                style="padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--card-shadow); background: var(--bg-card, #fff); color: var(--text-strong); font-size: 1.6rem; outline: none;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="message" style="color: var(--card-shadow); font-weight: bold;">Message</label>
            <textarea id="message" name="message" rows="6" required placeholder="How can we help you?"
                style="padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--card-shadow); background: var(--bg-card, #fff); color: var(--text-strong); font-size: 1.6rem; resize: vertical; outline: none;"></textarea>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <button type="submit"
                style="background-color: var(--card-shadow); color: var(--color-bg); border: none; padding: 1rem 3rem; font-size: 1.6rem; font-weight: bold; border-radius: 2rem; cursor: pointer; transition: transform 0.2s, background-color 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                Send Message
            </button>
        </div>
    </form>
    <br>
</div>
