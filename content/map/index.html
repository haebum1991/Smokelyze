<div class="container">

        <option value="04">04:00</option>
        <option value="05">05:00</option>
        <option value="06">06:00</option>
        <option value="07">07:00</option>
        <option value="08">08:00</option>
        <option value="09">09:00</option>
        <option value="10">10:00</option>
        <option value="11">11:00</option>
        <option value="12">12:00</option>
        <option value="13">13:00</option>
        <option value="14">14:00</option>
        <option value="15">15:00</option>
        <option value="16">16:00</option>
        <option value="17">17:00</option>
        <option value="18">18:00</option>
        <option value="19">19:00</option>
        <option value="20">20:00</option>
        <option value="21">21:00</option>
        <option value="22">22:00</option>

      <button class="minus1m" id="onMapMinus1m">-m</button>

      <button class="plus1h" id="onMapPlus1h" style="display: none;">+h</button>
      <!-- Hour buttons -->

      <button class="plus1m" id="onMapPlus1m">+m</button>

    </div>
  </div>
  
  <!-- Layer Toggle Button (Always on Map) -->
  <button class="accordion-toggle" id="AccordionToggle" title="Open Layers">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    </svg>
  </button>

  <!-- topright: accordion panel -->
  <div class="accordion-page collapsed" id="AccordionPage">
    <div class="accordion">
      <div class="accordion-header">
        <span class="accordion-title">Layers</span>
        <button id="AccordionClose" class="accordion-close-btn" title="Close">

        </button>

        </label>
        <label>

          WF incident locations
          <canvas class="ui-pulsing-icon" data-type="fire" width="30" height="30"
            style="vertical-align:middle; margin-right:0.4rem;"></canvas>
        </label>
        <label>
          <input type="checkbox" id="layer-MapPost">
          MapPost

            style="vertical-align:middle; margin-right:0.4rem;"></canvas>

        </label>

        <label><input type="checkbox" id="layer-airnow-ozone"> O3-hr</label>

        </label>
      </details>

      <details>

        <label for="MapDataSelect">Select dataset:</label>

          <option value="gam-v1">UW GAM-v1 (Lee and Jaffe, 2024) </option>
          <option value="pm-cbsa">UW Smoke PM2.5 (Under review) </option>
          <option value="epa-ember">EPA EMBER (Simon, et al., 2024) </option>
        </select>

        <div id="MapCheckboxPublished">

          <!-- Data 추가시 로직 추가 필요 부분** -->
          <label><input type="checkbox" id="layer-mda8-obs"> Obs MDA8 </label>
          <label><input type="checkbox" id="layer-mda8-pred"> Pred MDA8 </label>
          <label><input type="checkbox" id="layer-smo"> SMO </label>
          <label><input type="checkbox" id="layer-resids"> Residual </label>
          <label><input type="checkbox" id="layer-resids-quant"> Quant residual

          <label><input type="checkbox" id="layer-pm25-obs"> Obs PM2.5 </label>

            Pred MDA8 (EDM)
          </label>
          <label><input type="checkbox" id="layer-smo-edm"> SMO (EDM) </label>
          <label><input type="checkbox" id="layer-resids-edm"> Residual (EDM) </label>
          <label><input type="checkbox" id="layer-resids-quant-edm"> Quant residual (EDM) </label>

          <label>
            <hr style="margin-top: 0.2rem; margin-bottom: 0.2rem;"> <input type="checkbox" id="layer-smokeday"> Smoke
            day (SMD)
          </label>
          <label><input type="checkbox" id="layer-smokeday-975"> SMO > 97.5th </label>
          <label><input type="checkbox" id="layer-smokeday-975-edm"> SMO > 97.5th (EDM) </label>

          <label><input type="checkbox" id="layer-ExcDays"> Exc. day </label>
          <label><input type="checkbox" id="layer-ExcDays-edm"> Exc. day (EDM) </label>

          <label><input type="checkbox" id="layer-ExcDays-m0p5m"> Exc. day m0p5m </label>
          <label><input type="checkbox" id="layer-ExcDays-m1p0m"> Exc. day m1p0m </label>

</div>

<script>
  const LAYER_CONFIG = {
    "gam-v1": [
      "layer-mda8-obs", "layer-mda8-pred", "layer-smo", "layer-resids", "layer-resids-quant",
      "layer-pm25-obs", "layer-pm25-quant", "layer-pm25-crit", "layer-tmax", "layer-srad",
      "layer-smokeday", "layer-smokeday-975",
      "layer-ExcDays"
    ],

    "gam-v2": [
      "layer-mda8-obs", "layer-mda8-pred", "layer-smo", "layer-resids", "layer-resids-quant",
      "layer-pm25-obs", "layer-pm25-quant", "layer-pm25-crit",
      "layer-tmax", "layer-srad",
      "layer-mda8-pred-edm", "layer-smo-edm", "layer-resids-edm", "layer-resids-quant-edm",
      "layer-smokeday", "layer-smokeday-975", "layer-smokeday-975-edm",
      "layer-ExcDays", "layer-ExcDays-edm"
    ],

    "pm-cbsa": [
      "layer-pm25-obs", "layer-pm25-quant",
      "layer-pm25-crit-m0p5m", "layer-pm25-crit-m1p0m",
      "layer-pm25-smoke-m0p5m", "layer-pm25-smoke-m1p0m",
      "layer-smokeday-m0p5m", "layer-smokeday-m1p0m",
      "layer-ExcDays-m0p5m", "layer-ExcDays-m1p0m"
    ],

    "epa-ember": [
      "layer-mda8-obs", "layer-mda8-pred", "layer-smo", "layer-resids",
      "layer-ExcDays"
    ]
  };

  const datasetSelect = document.getElementById("MapDataSelect");
  const allLayersDiv = document.getElementById("MapCheckboxPublished");
  const allLabels = allLayersDiv.querySelectorAll("label");

  function updateLayerVisibility() {
    const selectedValue = datasetSelect.value;
    const visibleLayerIds = LAYER_CONFIG[selectedValue] || [];

    allLabels.forEach(label => {
      label.style.display = "none";
    });

    visibleLayerIds.forEach(id => {
      const labelToShow = document.querySelector(`label input#${id}`).closest("label");
      if (labelToShow) {
        labelToShow.style.display = "block";
      }
    });
  }

  datasetSelect.addEventListener("change", updateLayerVisibility);
  updateLayerVisibility();
</script>

<!-- MapPost Context Menu -->

  <div class="reply-btn-wrapper" style="justify-content: center;">
    <button class="reply-btn-submit" id="MapPostBtnWrite">Write</button>
    <button class="reply-btn-cancel" id="MapPostBtnClose">Close</button>
  </div>
</div>

<!-- MapPost Modal -->
<div class="MapPost-modal-overlay" id="MapPostModalOverlay" style="display:none;">
  <div class="MapPost-modal">
    <div class="MapPost-modal-header">
      <h3 id="MapPostModalTitle">New MapPost</h3>
      <button id="MapPostModalClose">&times;</button>
    </div>

    <!-- View Mode Content -->
    <div id="MapPostModalViewBody" style="display:flex; flex:1; flex-direction:column;">
      <!-- Injected via JS -->
    </div>

    <!-- Edit/Create Mode Content -->
    <div id="MapPostModalEditBody" style="display:flex; flex:1; flex-direction:column;">
      <div class="MapPost-modal-body">
        <div class="MapPost-form-group">
          <label for="MapPostFormTitle">Title <small id="MapPostTitleCounter" style="float: right;">0/100</small></label>
          <input type="text" id="MapPostFormTitle" placeholder="Enter title...">
        </div>

        <div class="MapPost-form-group">
          <label>Visibility</label>
          <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
              <input type="radio" name="MapPostVisibility" value="public" checked> Public
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
              <input type="radio" name="MapPostVisibility" value="private"> Private
