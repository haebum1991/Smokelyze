
<script>
  function setupNavToggle() {
    const nav = document.getElementById("mainNav");
    const openBtn = document.getElementById("navToggle");
    const closeBtn = nav ? nav.querySelector(".nav-toggle-close") : null;
    
    if (!nav || !openBtn) return;
    
    openBtn.onclick = null;
    nav.onclick = null;
    if (closeBtn) closeBtn.onclick = null; 
  
    const closeMenu = () => {
        nav.classList.remove("show");
        openBtn.setAttribute("aria-expanded", "false"); 
    }
  
    openBtn.addEventListener("click", () => {
      const isShowing = nav.classList.toggle("show");
      openBtn.setAttribute("aria-expanded", String(isShowing));
    });
  
    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        closeMenu();
      });
    }
  
    nav.addEventListener("click", e => {
      if (e.target.tagName === "A" && window.innerWidth <= 1024) {
        closeMenu(); 
      }
    });
    
    // Swipe to close logic (Aligned with addSwipeClose utility)
    let touchStartX = 0;
    let touchMoveX = 0;
    let isDragging = false;

    nav.addEventListener("touchstart", (e) => {
      if (window.innerWidth > 1024) return;
      touchStartX = e.touches[0].clientX;
      isDragging = false;
    }, { passive: true });

    nav.addEventListener("touchmove", (e) => {
      if (window.innerWidth > 1024 || !nav.classList.contains("show")) return;

      touchMoveX = e.touches[0].clientX;
      const deltaX = touchMoveX - touchStartX;

      if (deltaX > 0) { // Moving right to close
        if (!isDragging) {
          nav.style.transition = "none";
          isDragging = true;
        }
        nav.style.transform = `translateX(${deltaX}px)`;
      } else if (isDragging) {
        nav.style.transform = "";
      }
    }, { passive: true });

    nav.addEventListener("touchend", () => {
      if (window.innerWidth > 1024 || !isDragging) return;

      nav.style.transition = "";
      const deltaX = touchMoveX - touchStartX;

      if (deltaX > 50) { // Threshold 50px as in ui-toggles.js
        closeMenu();
      }

      nav.style.transform = "";
      touchStartX = 0;
      touchMoveX = 0;
      isDragging = false;
    }, { passive: true });
    
    // Dropdown toggle logic
    const dropdownTriggers = nav.querySelectorAll(".nav-dropdowns, #ProfileBtnUser");
    dropdownTriggers.forEach(trigger => {
      trigger.addEventListener("click", (e) => {
        e.stopPropagation();

        const dropdown = trigger.nextElementSibling;
        if (!dropdown || !dropdown.classList.contains("profile-dropdown")) return;

        // Close ALL dropdowns first except the current one
        document.querySelectorAll(".profile-dropdown").forEach(d => {
          if (d !== dropdown) d.classList.remove("show");
        });

        // Toggle the current one
        dropdown.classList.toggle("show");
      });
    });

    window.addEventListener("click", () => {
      document.querySelectorAll(".profile-dropdown").forEach(d => {
        d.classList.remove("show");
      });
    });
  }
  
  document.readyState === "loading"
    ? document.addEventListener("DOMContentLoaded", setupNavToggle)
    : setupNavToggle();
</script>


<nav class="nav">
  <a href="{{ "/" | relURL }}" class="nav-logo">
    <img src="{{ print "images/" .Site.Params.logo.url | relURL }}" width="{{ .Site.Params.logo.width }}"
      height="{{ .Site.Params.logo.height }}" alt="{{ .Site.Params.logo.alt }}">
  </a>

  <button id="theme-toggle" type="button" class="theme-toggle-btn">
    Dark mode
  </button>

  <button class="nav-toggle" id="navToggle">☰</button>

  <ul class="nav-links" id="mainNav">
    <button class="nav-toggle-close" aria-label="Close">&times;</button>

    {{ range .Site.Menus.main }}
    {{ if .HasChildren }}
    <li class="profile-box">
      <a href="javascript:void(0)" class="nav-dropdowns">{{ .Name }}</a>
      <div class="profile-dropdown">
        {{ range .Children }}
        <button class="profile-btn-item" onclick="location.href='{{ .URL }}'">{{ .Name }}</button>
        {{ end }}
      </div>
    </li>
    {{ else }}
    <li><a href="{{ .URL }}">{{ .Name }}</a></li>
    {{ end }}
    {{ end }}
    <li id="NavAuthItem">
      <!-- Unauthenticated State -->
      <div id="ProfileBoxUnauthenticated" style="display: none;">
        <a href="javascript:void(0)" id="NavBtnAuth">Login</a>
      </div>

      <!-- Authenticated State (Profile Icon) -->
      <div class="profile-box" id="ProfileBoxAuthenticated" style="display: none;">
        <button class="profile-btn-user" id="ProfileBtnUser" aria-label="User profile">
          <div class="profile-avatar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
          </div>
        </button>
        <div class="profile-dropdown" id="ProfileDropdown">
          <button class="profile-btn-item" id="ProfileBtnProfile">
            Profiles
          </button>
          <button class="profile-btn-item" id="ProfileBtnSettings">
            Settings
          </button>
          <button class="profile-btn-item logout" id="ProfileBtnLogout">
            Logout
          </button>
        </div>
      </div>

      <script>
        (function () {
          const lastState = sessionStorage.getItem("auth-last-state");
          const unauth = document.getElementById("ProfileBoxUnauthenticated");
          const auth = document.getElementById("ProfileBoxAuthenticated");
          if (lastState === "in") {
            if (auth) auth.style.display = "flex";
          } else {
            if (unauth) unauth.style.display = "block";
          }
        })();
      </script>
    </li>
  </ul>
</nav>
