
name: Update MERRA-2 Data to GCS

on:
  schedule:
    - cron: "0 17 * * *" # Every day at 17:00 UTC
  workflow_dispatch: # Allow manual trigger
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  update-merra2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        run: |
          echo "$GCS_SERVICE_ACCOUNT_KEY" > gcs-key.json
        env:
          GCS_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_PMO3SMOKETOOL }}

      - name: Run MERRA-2 fetcher
        run: |
          if [ "${{ github.event.inputs.target_date }}" != "" ]; then
            python scripts/fetch_merra2.py --project pmo3smoketool --date ${{ github.event.inputs.target_date }}
          else
            python scripts/fetch_merra2.py --project pmo3smoketool
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcs-key.json

      - name: Clean up credentials
        if: always()
        run: rm gcs-key.json

