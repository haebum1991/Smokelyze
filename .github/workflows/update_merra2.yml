
name: Update MERRA-2 Data to GCS

on:
  schedule:
    - cron: "0 17 * * *" # 09:00 AM Seattle time (PST / UTC-8)
  workflow_dispatch: # Allow manual trigger
    inputs:
      target_date:
        description: "Target date (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  update-merra2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R dependencies
        run: |
          Rscript -e "install.packages(c('reticulate', 'raster', 'jsonlite', 'googleCloudStorageR', 'httr'))"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install earthengine-api google-auth

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_PMO3SMOKETOOL }}

      - name: Run MERRA-2 Update (R)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_config_file }}
        run: |
          Rscript scripts/fetch_merra2.R ${{ github.event.inputs.target_date }}


